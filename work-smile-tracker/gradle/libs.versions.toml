[versions]
kotlin = "2.1.0"
compose-multiplatform = "1.7.3"
compose-bom-mp = "2024.12.01"
agp = "8.7.3"
sqldelight = "2.0.2"
camerax = "1.4.1"
workmanager = "2.10.0"
coroutines = "1.9.0"
lifecycle = "2.8.7"
kotlinx-datetime = "0.6.1"
kotlinx-serialization = "1.7.3"

[libraries]
# ── Compose Multiplatform BOM ──
compose-bom-mp = { group = "org.jetbrains.compose", name = "compose-bom", version.ref = "compose-bom-mp" }

# ── Compose Multiplatform (KMP, 无版本由 BOM 管理) ──
compose-mp-runtime    = { group = "org.jetbrains.compose.runtime", name = "runtime" }
compose-mp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation" }
compose-mp-material3  = { group = "org.jetbrains.compose.material3", name = "material3" }
compose-mp-ui         = { group = "org.jetbrains.compose.ui", name = "ui" }

# ── Compose Android (androidX, 用于 Android 专属调试工具) ──
compose-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-activity           = { group = "androidx.activity", name = "activity-compose", version = "1.9.3" }

# ── Lifecycle ──
compose-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# ── SQLDelight ──
sqldelight-android-driver     = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-native-driver      = { group = "app.cash.sqldelight", name = "native-driver", version.ref = "sqldelight" }
sqldelight-coroutines-ext     = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
sqldelight-runtime            = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
sqldelight-primitive-adapters = { group = "app.cash.sqldelight", name = "primitive-adapters", version.ref = "sqldelight" }

# ── MediaPipe ──
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version = "0.10.18" }

# ── CameraX ──
camerax-core       = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2    = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle  = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view       = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# ── WorkManager ──
workmanager-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# ── Coroutines ──
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# ── kotlinx-datetime ──
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }

# ── AndroidX ──
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.15.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight           = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
