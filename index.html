<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080808">
<title>Desk Clock</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    background: #080808;
    color: #f0f0f0;
    font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    animation: breathe 18s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(0.94); }
  }

  /* 主时钟区域 */
  .clock-section {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .time-face {
    display: flex;
    align-items: baseline;
    gap: 0.02em;
    line-height: 1;
    font-size: clamp(22vw, 30vh, 38vw);
    font-weight: 200;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    will-change: contents;
  }

  .time-face .num {
    display: inline-block;
    min-width: 1.45em;
    text-align: center;
    transition: opacity 0.18s ease, transform 0.18s ease;
    position: relative;
  }
  .time-face .num.changing {
    opacity: 0.6;
    transform: scale(0.985);
  }

  .colon {
    display: inline-block;
    width: 0.3em;
    text-align: center;
    opacity: 0.85;
    animation: blink 1.6s infinite ease-in-out;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.9; }
    50%      { opacity: 0.25; }
  }

  /* 秒数 */
  .seconds {
    display: inline-block;
    font-size: 0.35em;
    font-weight: 200;
    opacity: 0.35;
    min-width: 2em;
    text-align: left;
    margin-left: 0.1em;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    align-self: baseline;
    padding-bottom: 0.08em;
  }

  /* 日期 + 天气 */
  .date-line {
    margin-top: 0.6em;
    font-size: clamp(4vw, 5vh, 6vw);
    font-weight: 300;
    letter-spacing: 0.04em;
    opacity: 0.75;
    font-variant-numeric: tabular-nums;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    flex-wrap: wrap;
  }
  .date-line .dot { margin: 0 0.4em; opacity: 0.35; }

  .weather-info {
    display: inline-flex;
    align-items: center;
    gap: 0.35em;
    opacity: 0.6;
    font-size: 0.85em;
    transition: opacity 0.4s ease;
  }
  .weather-info .weather-icon {
    font-size: 1.1em;
    line-height: 1;
  }
  .weather-info .weather-temp {
    font-variant-numeric: tabular-nums;
  }
  .weather-info.loading .weather-temp {
    opacity: 0.4;
  }

  /* 下班倒计时 */
  .countdown {
    margin-top: 0.7em;
    padding: 0.42em 1.4em;
    font-size: clamp(3.5vw, 4.2vh, 5vw);
    font-weight: 300;
    border: 1px solid #262626;
    border-radius: 999px;
    opacity: 0.92;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    background: rgba(255,255,255,0.015);
    transition: opacity 0.25s ease, border-color 0.3s ease, background 0.3s ease;
  }
  .countdown.over { opacity: 0.4; }

  /* 外卖提醒横幅 */
  .takeout-reminder {
    position: fixed;
    bottom: clamp(2vh, 4vh, 6vh);
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    padding: 0.7em 2em;
    font-size: clamp(3.5vw, 4.5vh, 5.5vw);
    font-weight: 400;
    border: 1px solid #e8b84b;
    border-radius: 999px;
    background: rgba(232, 184, 75, 0.08);
    color: #e8b84b;
    letter-spacing: 0.06em;
    white-space: nowrap;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
    opacity: 0;
    z-index: 100;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .takeout-reminder.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  @keyframes reminderPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232, 184, 75, 0.15); }
    50%      { box-shadow: 0 0 20px 4px rgba(232, 184, 75, 0.12); }
  }
  @keyframes reminderDrift {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-6px); }
  }
  .takeout-reminder.show {
    animation: reminderPulse 2.4s ease-in-out infinite, reminderDrift 24s ease-in-out infinite;
  }

  /* 设置按钮 */
  .settings-trigger {
    position: fixed;
    top: 14px;
    right: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .settings-trigger:hover,
  .settings-trigger:focus-visible { opacity: 1; }
  .settings-trigger::before {
    content: '⚙';
    font-size: 18px;
    color: #666;
  }

  /* 设置浮窗 */
  .settings-panel {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 4.5vw;
    z-index: 200;
  }
  .settings-panel.open { display: flex; }
  .settings-inner { text-align: center; width: 80%; max-width: 400px; }
  .settings-inner h3 {
    font-weight: 400;
    margin-bottom: 0.5em;
    opacity: 0.7;
    font-size: 5vw;
  }
  .settings-inner .field {
    margin: 0.8em 0;
    text-align: left;
  }
  .settings-inner label {
    display: block;
    margin-bottom: 0.25em;
    opacity: 0.6;
    font-size: 3.5vw;
  }
  .settings-inner .field-row {
    display: flex;
    gap: 0.6em;
    align-items: center;
  }
  .settings-inner input {
    background: transparent;
    border: 1px solid #333;
    color: inherit;
    font-size: 5vw;
    text-align: center;
    padding: 0.25em 0.5em;
    border-radius: 4px;
    width: 5em;
  }
  .settings-inner input[type="checkbox"] {
    width: auto;
    transform: scale(1.4);
  }
  .settings-inner .checkbox-label {
    display: flex;
    align-items: center;
    opacity: 0.8;
    font-size: 3.8vw;
    cursor: pointer;
    gap: 0.4em;
  }
  .settings-inner .btn-row {
    margin-top: 1.2em;
    display: flex;
    gap: 0.6em;
    justify-content: center;
  }
  .settings-inner button {
    background: transparent;
    color: inherit;
    border: 1px solid #444;
    padding: 0.35em 1.2em;
    border-radius: 999px;
    font-size: 4vw;
    cursor: pointer;
  }
  .settings-inner button:hover { background: rgba(255,255,255,0.05); }

  /* 暗色纹理（防 OLED 烧屏） */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.012) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.008) 0%, transparent 35%);
    mix-blend-mode: screen;
  }

  @media (orientation: landscape) {
    .time-face { font-size: clamp(20vw, 35vh, 34vw); }
    .date-line { font-size: clamp(2.5vw, 3.5vh, 4vw); }
    .countdown  { font-size: clamp(2.5vw, 3.5vh, 4vw); }
    .takeout-reminder { font-size: clamp(2.5vw, 3.5vh, 4vw); }
    .settings-inner h3 { font-size: 3.5vw; }
    .settings-inner label { font-size: 2.5vw; }
    .settings-inner input { font-size: 3.5vw; }
    .settings-inner button { font-size: 3vw; }
  }
</style>
</head>
<body>

  <button class="settings-trigger" id="settingsBtn" aria-label="设置"></button>

  <main>
    <div class="clock-section">
      <div class="time-face">
        <span class="num" id="hour">--</span>
        <span class="colon">:</span>
        <span class="num" id="minute">--</span>
        <span class="seconds" id="seconds">--</span>
      </div>

      <div class="date-line" id="dateLine">
        <span class="date-text">--</span>
        <span class="weather-info loading" id="weatherInfo">
          <span class="weather-icon">--</span>
          <span class="weather-temp">定位中…</span>
        </span>
      </div>

      <div class="countdown" id="countdown">--</div>
    </div>
  </main>

  <div class="takeout-reminder" id="takeoutReminder">🍜 该点外卖了！</div>

  <div class="settings-panel" id="panel">
    <div class="settings-inner">
      <h3>设置</h3>
      <div class="field">
        <label>下班时间</label>
        <input type="time" id="endTime" value="17:00">
      </div>
      <div class="field">
        <div class="field-row">
          <input type="time" id="takeoutStart" value="10:30">
          <span style="opacity:0.4">—</span>
          <input type="time" id="takeoutEnd" value="11:00">
        </div>
        <label style="margin-top:0.2em">外卖提醒时间段</label>
      </div>
      <div class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="notifyEnabled" checked>
          <span>启用系统通知提醒</span>
        </label>
      </div>
      <div class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="weatherEnabled" checked>
          <span>显示本地天气</span>
        </label>
      </div>
      <div class="btn-row">
        <button id="saveBtn">保存</button>
        <button id="cancelBtn">取消</button>
      </div>
    </div>
  </div>

<script>
(() => {
  // ── DOM 引用 ──
  const $hour = document.getElementById('hour');
  const $minute = document.getElementById('minute');
  const $seconds = document.getElementById('seconds');
  const $dateLine = document.getElementById('dateLine');
  const $dateText = $dateLine.querySelector('.date-text');
  const $weatherInfo = document.getElementById('weatherInfo');
  const $weatherIcon = $weatherInfo.querySelector('.weather-icon');
  const $weatherTemp = $weatherInfo.querySelector('.weather-temp');
  const $countdown = document.getElementById('countdown');
  const $panel = document.getElementById('panel');
  const $endTime = document.getElementById('endTime');
  const $takeoutStart = document.getElementById('takeoutStart');
  const $takeoutEnd = document.getElementById('takeoutEnd');
  const $notifyEnabled = document.getElementById('notifyEnabled');
  const $weatherEnabled = document.getElementById('weatherEnabled');
  const $settingsBtn = document.getElementById('settingsBtn');
  const $saveBtn = document.getElementById('saveBtn');
  const $cancelBtn = document.getElementById('cancelBtn');
  const $takeoutReminder = document.getElementById('takeoutReminder');

  // ── 配置 ──
  const STORAGE_KEY = 'deskclock_config';
  let config = loadConfig();
  let takeoutNotified = false;

  function loadConfig() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return Object.assign({
          endTime: '17:00',
          takeoutStart: '10:30',
          takeoutEnd: '11:00',
          notifyEnabled: true,
          weatherEnabled: true
        }, parsed);
      }
    } catch {}
    return { endTime: '17:00', takeoutStart: '10:30', takeoutEnd: '11:00', notifyEnabled: true, weatherEnabled: true };
  }

  function saveConfig() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(config)); } catch {}
  }

  // ── 工具函数 ──
  const pad2 = n => String(n).padStart(2, '0');

  function timeToMinutes(hhmm) {
    const [h, m] = hhmm.split(':').map(Number);
    return h * 60 + m;
  }

  function setNum(el, next) {
    const current = el.textContent;
    if (current === next) return;
    el.classList.add('changing');
    el.textContent = next;
    setTimeout(() => el.classList.remove('changing'), 200);
  }

  // ── 日期格式化 ──
  function updateDate(now) {
    const year  = now.getFullYear();
    const month = now.getMonth() + 1;
    const day   = now.getDate();
    const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const week = weekDays[now.getDay()];
    $dateText.innerHTML =
      '<span>' + year + '</span><span class="dot">·</span><span>' + pad2(month) + '-' + pad2(day) + '</span><span class="dot">·</span><span>' + week + '</span>';
  }

  // ── 秒数 ──
  function updateSeconds(now) {
    setNum($seconds, pad2(now.getSeconds()));
  }

  // ── 天气 (Open-Meteo, 免费无 Key) ──
  const LAT_KEY = 'deskclock_lat';
  const LON_KEY = 'deskclock_lon';
  const WEATHER_CACHE_KEY = 'deskclock_weather_cache';

  // WMO 天气代码 → 图标 + 描述
  function wmoToIcon(code) {
    if (code === 0)  return '☀️';
    if (code <= 3)  return '🌤';
    if (code <= 48) return '🌫';
    if (code <= 57) return '🌦';
    if (code <= 67) return '🌧';
    if (code <= 77) return '🌨';
    if (code <= 82) return '🌧';
    if (code <= 86) return '🌨';
    if (code <= 99) return '⛈';
    return '🌡';
  }

  function getCachedWeather() {
    try {
      const raw = localStorage.getItem(WEATHER_CACHE_KEY);
      if (!raw) return null;
      const cache = JSON.parse(raw);
      // 缓存有效期 30 分钟
      if (Date.now() - cache.timestamp < 30 * 60 * 1000) {
        return cache.data;
      }
    } catch {}
    return null;
  }

  function setCachedWeather(data) {
    try {
      localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: data }));
    } catch {}
  }

  async function fetchWeather(lat, lon) {
    try {
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true&timezone=auto';
      const resp = await fetch(url);
      if (!resp.ok) return null;
      const json = await resp.json();
      if (!json.current_weather) return null;
      const w = json.current_weather;
      return {
        temp: Math.round(w.temperature),
        code: w.weathercode
      };
    } catch {
      return null;
    }
  }

  async function updateWeather() {
    if (!config.weatherEnabled) {
      $weatherInfo.style.display = 'none';
      return;
    }
    $weatherInfo.style.display = 'inline-flex';

    // 优先用缓存
    const cached = getCachedWeather();
    if (cached) {
      $weatherInfo.classList.remove('loading');
      $weatherIcon.textContent = wmoToIcon(cached.code);
      $weatherTemp.textContent = cached.temp + '°';
      return;
    }

    // 获取位置
    const lat = localStorage.getItem(LAT_KEY);
    const lon = localStorage.getItem(LON_KEY);

    if (lat && lon) {
      const data = await fetchWeather(parseFloat(lat), parseFloat(lon));
      if (data) {
        setCachedWeather(data);
        $weatherInfo.classList.remove('loading');
        $weatherIcon.textContent = wmoToIcon(data.code);
        $weatherTemp.textContent = data.temp + '°';
      } else {
        $weatherTemp.textContent = '--°';
        $weatherIcon.textContent = '🌡';
      }
    } else {
      $weatherTemp.textContent = '定位中…';
      $weatherIcon.textContent = '--';
    }
  }

  function requestGeolocation() {
    if (!('geolocation' in navigator)) {
      $weatherTemp.textContent = '无定位';
      $weatherIcon.textContent = '--';
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function(pos) {
        const lat = pos.coords.latitude.toFixed(2);
        const lon = pos.coords.longitude.toFixed(2);
        localStorage.setItem(LAT_KEY, lat);
        localStorage.setItem(LON_KEY, lon);
        updateWeather();
      },
      function() {
        $weatherTemp.textContent = '定位失败';
        $weatherIcon.textContent = '--';
      },
      { timeout: 10000, maximumAge: 86400000 }
    );
  }

  // 启动天气流程
  function initWeather() {
    if (!config.weatherEnabled) {
      $weatherInfo.style.display = 'none';
      return;
    }
    // 如果没缓存 → 尝试定位
    const cached = getCachedWeather();
    if (!cached) {
      requestGeolocation();
    }
    updateWeather();
    // 每 30 分钟刷新一次
    setInterval(updateWeather, 30 * 60 * 1000);
  }

  // ── 下班倒计时 ──
  function updateCountdown(now) {
    const [h, m] = config.endTime.split(':').map(Number);
    const end = new Date(now);
    end.setHours(h, m, 0, 0);

    if (end <= now) {
      end.setDate(end.getDate() + 1);
    }

    const diff = end - now;
    if (diff > 8 * 3600 * 1000) {
      $countdown.textContent = '今日已收工 ✦';
      $countdown.classList.add('over');
      return;
    }

    $countdown.classList.remove('over');
    const totalMin = Math.floor(diff / 60000);
    const hh = Math.floor(totalMin / 60);
    const mm = totalMin % 60;
    $countdown.textContent =
      (hh > 0 ? '离下班还有 ' + hh + ' 小时 ' + mm + ' 分钟' : '离下班还有 ' + mm + ' 分钟');
  }

  // ── 外卖提醒 ──
  function updateTakeoutReminder(now) {
    const startMin = timeToMinutes(config.takeoutStart);
    const endMin = timeToMinutes(config.takeoutEnd);
    const nowMin = now.getHours() * 60 + now.getMinutes();

    const isWeekend = (now.getDay() === 0 || now.getDay() === 6);
    const inWindow = !isWeekend && nowMin >= startMin && nowMin < endMin;

    if (inWindow) {
      $takeoutReminder.classList.add('show');
      if (!takeoutNotified && config.notifyEnabled) {
        sendTakeoutNotification();
        takeoutNotified = true;
      }
    } else {
      $takeoutReminder.classList.remove('show');
      if (!inWindow) takeoutNotified = false;
    }
  }

  function sendTakeoutNotification() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      new Notification('🍜 该点外卖了！', { body: '趁现在还有好选择', icon: 'icon.svg' });
    } else if (Notification.permission !== 'denied') {
      Notification.requestPermission().then(function(perm) {
        if (perm === 'granted') {
          new Notification('🍜 该点外卖了！', { body: '趁现在还有好选择', icon: 'icon.svg' });
        }
      });
    }
  }

  // ── 主循环 ──
  function tick() {
    const now = new Date();
    setNum($hour, pad2(now.getHours()));
    setNum($minute, pad2(now.getMinutes()));
    updateSeconds(now);
    updateDate(now);
    updateCountdown(now);
    updateTakeoutReminder(now);
  }
  tick();
  setInterval(tick, 1000);

  // ── 设置面板 ──
  $endTime.value = config.endTime;
  $takeoutStart.value = config.takeoutStart;
  $takeoutEnd.value = config.takeoutEnd;
  $notifyEnabled.checked = config.notifyEnabled;
  $weatherEnabled.checked = config.weatherEnabled;

  $settingsBtn.addEventListener('click', function() { $panel.classList.add('open'); });
  $panel.addEventListener('click', function(e) {
    if (e.target === $panel) $panel.classList.remove('open');
  });

  $notifyEnabled.addEventListener('change', function() {
    if (this.checked && 'Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  });

  $saveBtn.addEventListener('click', function() {
    const endTimeVal = $endTime.value;
    const startVal = $takeoutStart.value;
    const endVal = $takeoutEnd.value;

    if (endTimeVal && /^\d{2}:\d{2}$/.test(endTimeVal)) config.endTime = endTimeVal;
    if (startVal && /^\d{2}:\d{2}$/.test(startVal)) config.takeoutStart = startVal;
    if (endVal && /^\d{2}:\d{2}$/.test(endVal)) config.takeoutEnd = endVal;
    config.notifyEnabled = $notifyEnabled.checked;
    config.weatherEnabled = $weatherEnabled.checked;

    saveConfig();
    takeoutNotified = false;

    // 天气开关变更时重新加载
    updateWeather();
    if (config.weatherEnabled) {
      const lat = localStorage.getItem(LAT_KEY);
      const lon = localStorage.getItem(LON_KEY);
      if (!lat || !lon) requestGeolocation();
    }

    tick();
    $panel.classList.remove('open');
  });

  $cancelBtn.addEventListener('click', function() {
    $endTime.value = config.endTime;
    $takeoutStart.value = config.takeoutStart;
    $takeoutEnd.value = config.takeoutEnd;
    $notifyEnabled.checked = config.notifyEnabled;
    $weatherEnabled.checked = config.weatherEnabled;
    $panel.classList.remove('open');
  });

  // ── 锁屏常亮 ──
  let wakeLock = null;
  async function tryAcquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function() { wakeLock = null; });
    } catch {}
  }
  ['click', 'touchstart', 'visibilitychange'].forEach(function(evt) {
    document.addEventListener(evt, function() {
      if (document.visibilityState === 'visible') tryAcquireWakeLock();
    });
  });

  // ── PWA 注册 ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  }

  // ── 初始化天气 ──
  initWeather();
})();
</script>

</body>
</html>
