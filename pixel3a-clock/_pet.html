<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>pet probe</title>
<style>body{margin:0;background:#222;font:12px monospace;color:#ddd}
iframe{border:0;display:block;background:#000}
#out{white-space:pre-wrap;padding:6px}</style>
</head>
<body>
<iframe id="land" width="807" height="393"></iframe>
<iframe id="port" width="393" height="807"></iframe>
<pre id="out"></pre>
<script>
const lines = [];
const L = s => { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); };

const bodies = ['青岛胶东机场新增直飞航线', '本场首条洲际货运航线开通', '暑运期间加密上海虹桥航班'];
localStorage.clockV7Messages = JSON.stringify(bodies.map((b, i) => ({
  id: 'p' + i, key: 'k' + i, title: '航线', body: b, source: 'news', level: 'info',
  url: 'https://example.com/' + i, exp: 172800000, ts: Date.now() - i * 60000,
})));
localStorage.clockV7State = JSON.stringify({ newsOn: false, pixelWander: false });

const overlap = (a, b) => !(a.right <= b.left || b.right <= a.left || a.bottom <= b.top || b.bottom <= a.top);

function check(tag, d, W, H) {
  const pet = d.getElementById('pet');
  L('=== ' + tag);
  if (!pet) { L('PET MISSING'); return; }
  const stage = d.querySelector('.clock-stage');
  const dig = d.querySelector('.numeric-digits');
  const dots = d.querySelector('.face-dots');
  const s = stage.getBoundingClientRect(), p = pet.getBoundingClientRect();
  L('pet   x=' + p.left.toFixed(0) + '–' + p.right.toFixed(0) + ' y=' + p.top.toFixed(0) + '–' + p.bottom.toFixed(0) +
    ' mood=' + pet.dataset.mood + ' off=' + pet.classList.contains('off'));
  L('stage x=' + s.left.toFixed(0) + '–' + s.right.toFixed(0) + ' y=' + s.top.toFixed(0) + '–' + s.bottom.toFixed(0));
  L('inside-stage: ' + (p.left >= s.left - 1 && p.right <= s.right + 1 && p.bottom <= s.bottom + 1 && p.top >= s.top - 1));
  L('overlap-digits: ' + overlap(p, dig.getBoundingClientRect()) + '  overlap-dots: ' + overlap(p, dots.getBoundingClientRect()));
  L('in-viewport: ' + (p.right <= W + 1 && p.bottom <= H + 1 && p.left >= -1 && p.top >= -1));
  // 戳一下
  pet.dispatchEvent(new d.defaultView.PointerEvent('pointerdown', { bubbles: true }));
  const say = d.getElementById('petSay');
  L('after-poke say="' + say.textContent + '" show=' + pet.classList.contains('say') + ' poke=' + pet.classList.contains('poke'));
  L('inline-x=' + pet.style.getPropertyValue('--pet-x') + ' inline-y=' + pet.style.getPropertyValue('--pet-y'));
  L('typeof-petTick=' + (typeof d.defaultView.petTick) + ' hidden=' + d.hidden + ' vis=' + d.visibilityState);
  L('pokes-stored=' + (JSON.parse(d.defaultView.localStorage.getItem('clockV7Pet') || '{}').pokes));
}

function run(id, tag, W, H) {
  const f = document.getElementById(id);
  f.src = 'index.html';
  return new Promise(res => { f.onload = () => setTimeout(() => { check(tag, f.contentDocument, W, H); res(); }, 4000); });
}

run('land', 'LANDSCAPE 807x393', 807, 393).then(() => run('port', 'PORTRAIT 393x807', 393, 807));
</script>
</body>
</html>
